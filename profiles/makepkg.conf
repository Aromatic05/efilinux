#!/usr/bin/env bash

set -euo pipefail

_target_triplet=${EFILINUX_TOOLCHAIN_TRIPLET:-$(gcc -dumpmachine)}
_target_gcc_root="$EFILINUX_SYSROOT/usr/lib/gcc/$_target_triplet"
_target_gcc_runtime_flags=()

if [[ -d "$_target_gcc_root" ]]; then
    mapfile -t _target_gcc_runtime_directories < <(
        find "$_target_gcc_root" -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort
    )
    if (( ${#_target_gcc_runtime_directories[@]} > 1 )); then
        die "multiple target GCC runtime directories found under $_target_gcc_root"
    fi
    if (( ${#_target_gcc_runtime_directories[@]} == 1 )); then
        _target_gcc_runtime_flags+=("-B${_target_gcc_runtime_directories[0]}/")
    fi
fi

export EFILINUX_TARGET_TRIPLET="$_target_triplet"
export CC=gcc
export CXX=g++
export AR=ar
export AS=as
export LD=ld
export NM=nm
export OBJCOPY=objcopy
export OBJDUMP=objdump
export RANLIB=ranlib
export STRIP=strip
export READELF=readelf
export CFLAGS="-O2 -march=$EFILINUX_X86_64_LEVEL -mtune=generic --sysroot=$EFILINUX_SYSROOT"
export CXXFLAGS="$CFLAGS"
export CPPFLAGS="--sysroot=$EFILINUX_SYSROOT"
export LDFLAGS="${_target_gcc_runtime_flags[*]} -B$EFILINUX_SYSROOT/usr/lib/ --sysroot=$EFILINUX_SYSROOT -Wl,-rpath-link,$EFILINUX_SYSROOT/usr/lib"
export MAKEFLAGS="-j$EFILINUX_JOBS"

unset _target_triplet _target_gcc_root _target_gcc_runtime_flags
unset _target_gcc_runtime_directories
